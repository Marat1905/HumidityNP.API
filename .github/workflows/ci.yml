name: Build, Test and Push Docker Images

on:
  push:
    branches: [ master, develop ]
    tags: [ 'v*' ]                     # триггер на теги
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Тестирование кода
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - run: dotnet restore HumidityNP.API.sln
      - run: dotnet build HumidityNP.API.sln --no-restore -c Release
      - run: dotnet test HumidityNP.API.sln --no-build -c Release

  # 2. Проверка Kubernetes манифестов (только для PR)
  lint-k8s:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        run: |
          # Замените 'k8s/' на путь к вашей папке с манифестами, если она другая
          kubeconform -strict -summary -kubernetes-version 1.29.0 k8s/ || echo "⚠️ Манифесты не найдены или есть ошибки"

  # 3. Сборка, публикация образа и обновление манифеста
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: write    # нужно для коммита и пуша изменённого манифеста
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # чтобы получить все теги (рекомендуется)

      # Преобразуем владельца в нижний регистр (для GHCR)
      - name: Set lowercase owner
        run: |
          OWNER_LC="${{ github.repository_owner }}"
          echo "OWNER_LC=${OWNER_LC,,}" >> $GITHUB_ENV

      # Извлекаем версию из тега (если это тег)
      - name: Get version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Для веток (не тегов) можно использовать "snapshot" или оставить пустым
            echo "VERSION=snapshot" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Сборка и публикация образа API
      - name: Build and push HumidityNP API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Humidity.API/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/humiditynp-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/humiditynp-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/humiditynp-api:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Обновление манифеста Kubernetes с новым тегом (только при пуше тега)
      - name: Update Kubernetes manifest with new tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ env.VERSION }}"
          MANIFEST="k8s/humidity-api-deployment.yaml"
          
          # Меняем строку image: ... на новую версию
          sed -i "s|image: ghcr.io/${{ env.OWNER_LC }}/humiditynp-api:.*|image: ghcr.io/${{ env.OWNER_LC }}/humiditynp-api:$VERSION|" $MANIFEST
          
          # Убедимся, что imagePullPolicy присутствует (если её нет – добавим)
          if ! grep -q "imagePullPolicy:" $MANIFEST; then
            sed -i "/image: ghcr.io\/${{ env.OWNER_LC }}\/humiditynp-api:$VERSION/a \          imagePullPolicy: IfNotPresent" $MANIFEST
          fi
          
          # Коммитим и пушим изменение (с [skip ci] чтобы не запускать новый ран)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $MANIFEST
          git commit -m "Update API image tag to $VERSION [skip ci]" || echo "No changes to commit"
          git push

