apiVersion: apps/v1
kind: Deployment
metadata:
  name: humidity-api
  namespace: uchaly
  labels:
    io.kompose.service: humidity-api
  annotations:
    # ИСПРАВЛЕНО: Вместо "semver" указываем "minor" (или "patch")
    keel.sh/policy: minor
    # Включаем опрос реестра
    keel.sh/trigger: poll
    # Интервал опроса (каждые 20 минут)
    keel.sh/pollSchedule: "@every 20m"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: humidity-api
  template:
    metadata:
      labels:
        io.kompose.service: humidity-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: humidity-api
          image: ghcr.io/marat1905/humiditynp-api:1.2.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__DefaultConnection
              value: Host=humidity-db;Port=5432;Database=HumidityDB;Username=postgres;Password=postgres
      restartPolicy: Always