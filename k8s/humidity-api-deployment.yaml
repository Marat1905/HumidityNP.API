apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: humidity-api
  name: humidity-api
  annotations:
    # Политика: обновлять на любой новый тег
    keel.sh/policy: force
    # Триггер: опрос реестра
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 20m"
    # Рекомендовано для чёткого определения версии (особенно для semver)
    keel.sh/match-tag: "true"
    keel.sh/match-tag-regexp: "v(?P<version>.+)"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: humidity-api
  template:
    metadata:
      labels:
        io.kompose.service: humidity-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__DefaultConnection
              value: Host=humidity-db;Port=5432;Database=HumidityDB;Username=postgres;Password=postgres
          image: ghcr.io/marat1905/humiditynp-api:v1.2.0
          imagePullPolicy: Always   # лучше Always
          name: humidity-api
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always