version: '3.8'

# ============================================================
# Общая сеть для всех сервисов.
# ============================================================
networks:
  humidity_network:
    driver: bridge

# ============================================================
# Именованные тома для персистентности данных.
# ============================================================
volumes:
  pgdata:
    name: humidity_pgdata
  rabbitmqdata:
    name: humidity_rabbitmqdata
  keycloakdata:
    name: humidity_keycloakdata

services:
  # ============================================================
  # PostgreSQL — основная реляционная БД для Humidity.API.
  # ============================================================
  db:
    image: postgres:17-alpine
    container_name: humidity_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HumidityDB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HumidityDB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - humidity_network


  # ============================================================
  # RabbitMQ — брокер сообщений.
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: humidity_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: humidity
      RABBITMQ_DEFAULT_PASS: humidity
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Web UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - humidity_network


  # ============================================================
  # Keycloak — OIDC-провайдер.
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: humidity_keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Опционально: логи в цвете и короткий формат
      KC_LOG_LEVEL: INFO
    ports:
      - "8080:8080"      # HTTP
      - "9000:9000"      # Management (health, metrics)
    volumes:
      # Файл realm-а для авто-импорта (read-only)
      - ./keycloak:/opt/keycloak/data/import:ro
      # Персистентное хранилище данных Keycloak (H2 в dev, PostgreSQL в prod)
      - keycloakdata:/opt/keycloak/data
    # Healthcheck: проверяем, что realm humidity импортирован и
    # well-known endpoint отвечает. Используем /dev/tcp через bash,
    # так как curl может отсутствовать в образе keycloak.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/humidity/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks:
      - humidity_network

  # ============================================================
  # YARP API Gateway — единая точка входа для фронтенда.
  # ============================================================
  gateway:
    build:
      context: .
      dockerfile: src/Humidity.ApiGateway/Dockerfile
    container_name: humidity_gateway
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Keycloak__Authority=http://keycloak:8080/realms/humidity
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/humidity/.well-known/openid-configuration
      - Keycloak__RequireHttpsMetadata=false
      - ReverseProxy__Clusters__humidity-api__Destinations__primary__Address=http://api:8080
      - ReverseProxy__Clusters__notification-service__Destinations__primary__Address=http://notification:8080
    ports:
      - "8090:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_started
      notification:
        condition: service_started
    networks:
      - humidity_network

  # ============================================================
  # Humidity.API — основной сервис.
  # ============================================================
  api:
    build:
      context: .
      dockerfile: src/Humidity.API/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: humidity_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=HumidityDB;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379,password=redis_password
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=humidity
      - RabbitMq__Password=humidity
      - RabbitMq__VirtualHost=/
      - Keycloak__Authority=http://keycloak:8080/realms/humidity
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/humidity/.well-known/openid-configuration
      - Keycloak__RequireHttpsMetadata=false
      - NotificationService__GrpcAddress=http://notification:8080
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - humidity_network

  # ============================================================
  # Humidity.Notification.Service — микросервис уведомлений.
  # ============================================================
  notification:
    build:
      context: .
      dockerfile: src/Humidity.Notification.Service/Dockerfile
    container_name: humidity_notification
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=humidity
      - RabbitMq__Password=humidity
      - RabbitMq__VirtualHost=/
      - Smtp__Host=mailhog
      - Smtp__Port=1025
      - Smtp__From=humidity@local
      - Smtp__UseSsl=false
      - Recipients__Default=dispatcher@example.com,manager@example.com
      - HumidityApi__GrpcAddress=http://api:8080
    ports:
      - "5002:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - humidity_network

  # ============================================================
  # MailHog — SMTP-ловушка для локальной разработки.
  # Web UI доступен на http://localhost:8025
  # ============================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: humidity_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - humidity_network